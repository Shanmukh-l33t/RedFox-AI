name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q redfox lab
      - name: Tests
        run: python -m pytest -q

  structural:
    name: Safety invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Only runtime.py may spawn processes
        run: python -m pytest tests/test_structural_guarantees.py -q
      - name: Scope engine refuses out-of-scope and over-autonomy actions
        run: python -m pytest tests/test_safety_core.py -q

  toolchain:
    name: Real tool adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install scanner binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap sslscan
          bash ./scripts/install-tools.sh
          # The Ubuntu whatweb package is broken on the runner (its wrapper looks
          # for /usr/bin/lib/messages), so take the script from upstream.
          git clone --depth 1 https://github.com/urbanadventurer/WhatWeb /tmp/whatweb
          sudo ln -sf /tmp/whatweb/whatweb /usr/local/bin/whatweb
          sudo gem install addressable --no-document
      - name: Start the lab target
        run: |
          python lab/vulnapp.py --port 8080 --admin-port 8081 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Adapters against real binaries
        run: python -m pytest tests/test_toolchain.py -q -rs

  end-to-end:
    name: End-to-end against the lab target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install scanners
        run: bash ./scripts/install-tools.sh
      - name: Update nuclei templates
        run: ./tools/bin/nuclei -update-templates -disable-update-check || true
      - name: Run the lab target and a campaign
        env:
          REDFOX_LLM_PROVIDER: ${{ secrets.REDFOX_LLM_PROVIDER }}
          REDFOX_LLM_MODEL: ${{ secrets.REDFOX_LLM_MODEL }}
          REDFOX_LLM_API_KEY: ${{ secrets.REDFOX_LLM_API_KEY }}
        run: |
          if [ -z "$REDFOX_LLM_API_KEY" ]; then
            echo "No LLM secret configured; skipping the live campaign."
            echo "Unit, structural and parser tests still gate this PR."
            exit 0
          fi
          python lab/vulnapp.py --port 8080 --admin-port 8081 &
          sleep 2
          export PYTHONPATH=. REDFOX_MAX_STEPS=12
          EID=$(python -m redfox.cli init examples/scope-lab.json | python -c "import sys,json;print(json.load(sys.stdin)['engagement'])")
          python -m redfox.cli run "$EID" --max-steps 12
          python -m redfox.cli report "$EID"
          python -m redfox.cli verify-audit
          python -m redfox.cli scope-check "$EID" https://example.com/ && exit 1 || exit 0